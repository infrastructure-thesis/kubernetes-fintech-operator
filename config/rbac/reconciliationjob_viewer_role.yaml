# This rule is not used by the project fintech-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to fintech.fintech.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: fintech-operator
    app.kubernetes.io/managed-by: kustomize
  name: reconciliationjob-viewer-role
rules:
- apiGroups:
  - fintech.fintech.io
  resources:
  - reconciliationjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - fintech.fintech.io
  resources:
  - reconciliationjobs/status
  verbs:
  - get
