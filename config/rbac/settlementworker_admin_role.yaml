# This rule is not used by the project fintech-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over fintech.fintech.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: fintech-operator
    app.kubernetes.io/managed-by: kustomize
  name: settlementworker-admin-role
rules:
- apiGroups:
  - fintech.fintech.io
  resources:
  - settlementworkers
  verbs:
  - '*'
- apiGroups:
  - fintech.fintech.io
  resources:
  - settlementworkers/status
  verbs:
  - get
