apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - fintech.io
  resources:
  - settlementworkers
  - tradingbots
  - reconciliationjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fintech.io
  resources:
  - settlementworkers/finalizers
  - tradingbots/finalizers
  - reconciliationjobs/finalizers
  verbs:
  - update
- apiGroups:
  - fintech.io
  resources:
  - settlementworkers/status
  - tradingbots/status
  - reconciliationjobs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
