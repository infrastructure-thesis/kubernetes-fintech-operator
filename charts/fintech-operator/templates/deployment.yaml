apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fintech-operator.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fintech-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fintech-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fintech-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fintech-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: {{ if .Values.image.digest }}"{{ .Values.image.repository }}@{{ .Values.image.digest }}"{{ else }}"{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"{{ end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/manager"]
        args:
        - --leader-elect={{ .Values.leaderElect }}
        - --metrics-bind-address={{ .Values.metrics.bindAddress }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
