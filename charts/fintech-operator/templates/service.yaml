apiVersion: v1
kind: Service
metadata:
  name: {{ include "fintech-operator.fullname" . }}-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fintech-operator.labels" . | nindent 4 }}
spec:
  ports:
  - name: metrics
    port: {{ .Values.metrics.port }}
    targetPort: {{ .Values.metrics.port }}
    protocol: TCP
  selector:
    {{- include "fintech-operator.selectorLabels" . | nindent 4 }}