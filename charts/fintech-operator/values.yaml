replicaCount: 1

image:
  repository: ghcr.io/infrastructure-thesis/kubernetes-fintech-operator
  tag: ""
  digest: ""                     # set to sha256:... to pin the deployed image
  pullPolicy: IfNotPresent

leaderElect: true

metrics:
  bindAddress: ":8080"           # keep in sync with metrics.port
  port: 8080

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi
