name: chart-and-image-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint charts/fintech-operator
      - run: helm template fintech-operator charts/fintech-operator > /dev/null
      - name: Require pinned image digest
        run: |
          digest=$(grep -E '^  digest:' charts/fintech-operator/values.yaml | awk '{print $2}' | tr -d '"')
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo "values.yaml image.digest must be a sha256 digest"; exit 1; }

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fintech-operator:scan .
      - name: Trivy vulnearbility scan
        uses: aquasecurity/trivy-action@v0.36.0  # verify latest tag; pin to commit SHA before relying on it
        with:
          image-ref: fintech-operator:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.4            # verify version; pin to commit SHA
        with:
          image: fintech-operator:scan
          format: spdx-json
          artifact-name: sbom.spdx.json
